<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 Robin Round Cá Nhân</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --primary: #ff6b35;
    --primary-glow: rgba(255,107,53,0.4);
    --secondary: #00b4d8;
    --accent: #ffd166;
    --bg-dark: #0b0f19;
    --bg-card: #141a2b;
    --bg-card-hover: #1c2438;
    --border: rgba(255,255,255,0.08);
    --text: #e8ecf4;
    --text-dim: #7a8ba5;
    --green: #22c55e;
    --red: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 40px;
}
body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 15% 20%, rgba(255,107,53,0.08) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 80%, rgba(0,180,216,0.06) 0%, transparent 45%);
    pointer-events: none; z-index: 0;
}
.wrapper { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 8px; }

header { text-align: center; padding: 16px 4px 14px; position: relative; }
.badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    color: #000; font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 3px 12px; border-radius: 20px; margin-bottom: 8px;
    box-shadow: 0 0 15px var(--primary-glow);
}
header h1 {
    font-family: 'Oswald', sans-serif; font-size: clamp(1.4rem, 6vw, 2.6rem);
    font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    background: linear-gradient(135deg, #fff 20%, var(--accent), var(--primary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    word-break: break-word;
}
header p { color: var(--text-dim); margin-top: 4px; font-size: 0.78rem; word-break: break-word; }
.divider { width: 50px; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); margin: 10px auto 0; border-radius: 2px; }

.auth-btns { position: absolute; top: 10px; right: 8px; display: flex; gap: 6px; z-index: 10; align-items: center; }
.auth-btns .btn { padding: 5px 10px; font-size: 0.7rem; min-height: 30px; border-radius: 8px; }
.auth-btns .user-label { font-size: 0.72rem; font-weight: 600; color: var(--text); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn {
    border: none; border-radius: 8px; font-family: 'Inter', sans-serif;
    font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    text-decoration: none; white-space: nowrap; min-height: 36px; padding: 7px 14px;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), #ff9248); color: #000; box-shadow: 0 4px 12px var(--primary-glow); }
.btn-primary:hover { transform: translateY(-1px); }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); }
.btn-danger { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-success { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.btn-sm { padding: 5px 9px; font-size: 0.68rem; min-height: 30px; }

.section { margin-bottom: 20px; }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.section-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.icon-rank { background: linear-gradient(135deg, var(--primary), #ff9248); }
.icon-match { background: linear-gradient(135deg, var(--secondary), #0096c7); }
.section-head h2 { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.section-head h2 span { color: var(--accent); }
.badge-count { margin-left: auto; background: var(--bg-card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 12px; font-size: 0.68rem; color: var(--text-dim); font-family: 'Oswald', sans-serif; }

.admin-controls { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.admin-controls h3 { font-family: 'Oswald', sans-serif; font-size: 0.85rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
.input-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.input-row input { flex: 1; min-width: 0; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text); padding: 9px 10px; border-radius: 8px; font-size: 0.82rem; }
.input-row input:focus { outline: none; border-color: var(--primary); }
.admin-only { display: none !important; }
.is-owner .admin-only { display: flex !important; }
.is-owner .admin-block { display: block !important; }
.admin-block { display: none; }

.rank-wrap { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.rank-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.rank-table thead th {
    background: rgba(255,107,53,0.12); padding: 8px 4px;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.65rem;
    text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
    color: var(--accent); border-bottom: 2px solid var(--primary);
    white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
.rank-table thead th:first-child { width: 32px; padding-left: 6px; }
.rank-table thead th:nth-child(2) { text-align: left; padding-left: 6px; min-width: 80px; }
.rank-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; }
.rank-table tbody tr:hover { background: rgba(255,107,53,0.05); }
.rank-table tbody tr:last-child { border-bottom: none; }
.rank-table td { padding: 7px 4px; text-align: center; vertical-align: middle; font-size: 0.75rem; }
.rank-table td:first-child { padding-left: 6px; }
.rank-table td:nth-child(2) { text-align: left; padding-left: 6px; font-weight: 500; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 0.72rem; font-family: 'Oswald', sans-serif; font-weight: 700; }
.r1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; box-shadow: 0 0 8px rgba(255,215,0,0.4); }
.r2 { background: linear-gradient(135deg, #c0c0c0, #8a8a8a); color: #000; }
.r3 { background: linear-gradient(135deg, #cd7f32, #a05a18); color: #fff; }
.r0 { background: var(--bg-card-hover); color: var(--text-dim); }
.plus { color: var(--green); font-weight: 700; }
.minus { color: var(--red); font-weight: 700; }
.match-count { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; }
.match-count .played { color: var(--accent); }

.match-grid { display: grid; gap: 10px; }
.match-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s ease; animation: fadeUp 0.4s ease forwards; opacity: 0; position: relative; }
.match-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.1); border-color: rgba(255,107,53,0.2); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.mc-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
.mc-round { font-family: 'Oswald', sans-serif; font-size: 0.65rem; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim); background: var(--bg-card-hover); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
.mc-status { font-size: 0.6rem; font-weight: 600; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
.mc-status.done { background: rgba(34,197,94,0.12); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
.mc-status.wait { background: rgba(255,209,102,0.12); color: var(--accent); border: 1px solid rgba(255,209,102,0.25); }
.mc-body { padding: 10px 6px; }
.mc-teams { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.mc-team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.mc-team-label { font-size: 0.55rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); }
.mc-team-names { font-weight: 600; font-size: 0.78rem; line-height: 1.3; word-break: break-word; }
.mc-team-names .amp { display: block; color: var(--text-dim); font-weight: 400; font-size: 0.65rem; margin: 1px 0; }
.mc-vs { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; min-width: 54px; }
.vs-circle { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 0.65rem; color: #000; }
.mc-score-row { display: flex; align-items: center; gap: 3px; }
.mc-score { font-family: 'Oswald', sans-serif; font-size: 1.15rem; font-weight: 700; min-width: 26px; text-align: center; padding: 2px 4px; border-radius: 5px; }
.mc-score.s1 { color: var(--primary); background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.2); }
.mc-score.s2 { color: var(--secondary); background: rgba(0,180,216,0.12); border: 1px solid rgba(0,180,216,0.2); }
.mc-score.sep { color: var(--text-dim); font-size: 0.85rem; padding: 0; background: none; border: none; min-width: auto; }
.mc-noscore { color: var(--text-dim); font-size: 0.68rem; font-style: italic; }
.score-input { width: 36px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text); text-align: center; font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 700; padding: 3px; border-radius: 6px; }
.score-input:focus { outline: none; border-color: var(--primary); }
.mc-actions { margin-top: 5px; display: flex; gap: 3px; justify-content: center; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(11,15,25,0.85); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 12px; }
.modal-box { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: modalPop 0.3s; }
@keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-box h2 { font-family: 'Oswald', sans-serif; font-size: 1.2rem; text-align: center; margin-bottom: 14px; color: var(--accent); text-transform: uppercase; }

#toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--bg-card); color: var(--text); padding: 9px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; z-index: 2000; display: none; box-shadow: 0 10px 15px rgba(0,0,0,0.3); border-left: 4px solid var(--green); max-width: 92vw; text-align: center; }
#toast.show { display: block; animation: slideIn 0.3s; }
#toast.err { border-left-color: var(--red); }
@keyframes slideIn { from { transform: translate(-50%,-20px); opacity: 0; } to { transform: translate(-50%,0); opacity: 1; } }

.loader { display: flex; flex-direction: column; align-items: center; padding: 24px 10px; gap: 10px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: rotate 0.7s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }
.err-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 16px 12px; text-align: center; }
.err-box h3 { color: var(--red); margin-bottom: 4px; font-size: 0.9rem; }
.err-box p { font-size: 0.78rem; color: var(--text-dim); }

.vdv-chip { background: var(--bg-card-hover); border: 1px solid var(--border); padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.vdv-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vdv-chip button { background: none; border: none; color: var(--red); cursor: pointer; font-weight: 700; padding: 0 2px; flex-shrink: 0; }

/* Debug info */
.debug-info { background: rgba(0,180,216,0.08); border: 1px solid rgba(0,180,216,0.2); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 0.7rem; color: var(--secondary); line-height: 1.5; }
.debug-info b { color: var(--accent); }

@media (max-width: 480px) {
    .wrapper { padding: 6px; }
    header { padding: 12px 4px 10px; }
    .auth-btns { top: 8px; right: 6px; }
    .auth-btns .user-label { max-width: 80px; font-size: 0.68rem; }
    .section-head h2 { font-size: 0.92rem; }
    .rank-table { font-size: 0.7rem; }
    .rank-table thead th { font-size: 0.6rem; padding: 6px 3px; }
    .rank-table td { padding: 6px 3px; font-size: 0.68rem; }
    .rank-table td:nth-child(2) { max-width: 85px; font-size: 0.7rem; }
    .rank-num { width: 22px; height: 22px; font-size: 0.68rem; }
    .mc-team-names { font-size: 0.72rem; }
    .mc-score { font-size: 1.05rem; min-width: 24px; }
    .score-input { width: 32px; font-size: 0.9rem; }
    .vs-circle { width: 26px; height: 26px; font-size: 0.6rem; }
    .btn { font-size: 0.72rem; padding: 6px 10px; min-height: 32px; }
    .btn-sm { font-size: 0.65rem; padding: 4px 8px; min-height: 28px; }
}

@media (max-width: 360px) {
    .rank-table td:nth-child(2) { max-width: 70px; }
    .mc-team-names { font-size: 0.68rem; }
    .mc-team-names .amp { font-size: 0.6rem; }
}
</style>
</head>
<body>

<div id="toast"></div>
<div class="wrapper">
    <header>
        <div class="auth-btns" id="authBtns"></div>
        <div class="badge">🏓 Robin Round Cá Nhân</div>
        <h1 id="headerTitle">Giải Đấu Pickleball</h1>
        <p id="headerSub">Bảng xếp hạng & Lịch thi đấu</p>
        <div class="divider"></div>
    </header>

    <div id="tourListScreen">
        <div class="section-head">
            <div class="section-icon icon-match">📋</div>
            <h2><span>Danh sách giải đấu</span></h2>
            <button class="btn btn-primary btn-sm admin-only" onclick="showModal('createTourModal')" style="margin-left:auto">➕ Tạo giải</button>
        </div>
        <div id="tourListContainer" class="match-grid"></div>
    </div>

    <div id="tourDetailScreen" style="display:none">
        <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="backToList()">← Quay lại</button>
            <button class="btn btn-secondary btn-sm" onclick="loadData()">🔄 Cập nhật</button>
            <button class="btn btn-danger btn-sm admin-only" onclick="deleteCurrentTour()" style="margin-left:auto">🗑️ Xóa giải</button>
        </div>

        <div class="admin-controls admin-block">
            <h3>⚙️ Quản lý Giải đấu</h3>
            <div class="input-row">
                <input type="text" id="newVdvName" placeholder="Tên VĐV (VD: Nguyễn Văn A)" onkeypress="if(event.key==='Enter')addVdv()">
                <button class="btn btn-primary btn-sm" onclick="addVdv()">Thêm</button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px;flex-wrap:wrap">
                <span style="font-size:0.75rem;color:var(--text-dim)">Đã đăng ký: <b id="vdvCount" style="color:var(--accent)">0</b> VĐV</span>
                <div style="display:flex;gap:4px;flex-wrap:wrap">
                    <button class="btn btn-success btn-sm" onclick="generateSchedule()">⚡ Tạo lịch 2v2</button>
                    <button class="btn btn-danger btn-sm" onclick="resetSchedule()">Xóa lịch</button>
                </div>
            </div>
            <div id="vdvList" style="display:flex;flex-wrap:wrap;gap:5px"></div>
        </div>

        <div id="scheduleDebug" class="debug-info" style="display:none"></div>

        <section class="section">
            <div class="section-head">
                <div class="section-icon icon-rank">🏆</div>
                <h2><span>Bảng Xếp Hạng</span></h2>
            </div>
            <div id="rank-area">
                <div class="loader"><div class="spinner"></div><span class="loader-text">Đang tải...</span></div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div class="section-icon icon-match">⚡</div>
                <h2><span>Lịch Thi Đấu & Kết Quả</span></h2>
                <div class="badge-count" id="mc-count">0 trận</div>
            </div>
            <div id="match-area">
                <div class="loader"><div class="spinner"></div><span class="loader-text">Đang tải...</span></div>
            </div>
        </section>
    </div>
</div>

<div id="loginModal" class="modal-overlay">
    <div class="modal-box">
        <h2>🔑 Đăng nhập Admin</h2>
        <div class="input-row" style="flex-direction:column">
            <input type="text" id="loginUser" placeholder="Tên đăng nhập">
            <input type="password" id="loginPass" placeholder="Mật khẩu" onkeypress="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Đăng nhập</button>
        <p style="text-align:center;margin-top:10px;font-size:0.75rem;color:var(--text-dim)">
            Chưa có tài khoản? <a href="#" onclick="closeModal('loginModal');showModal('registerModal')" style="color:var(--primary)">Đăng ký</a>
        </p>
        <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal('loginModal')">Hủy</button>
    </div>
</div>

<div id="registerModal" class="modal-overlay">
    <div class="modal-box">
        <h2>📝 Đăng ký</h2>
        <div class="input-row" style="flex-direction:column">
            <input type="text" id="regUser" placeholder="Tên (không dấu, không cách)">
            <input type="password" id="regPass" placeholder="Mật khẩu">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doRegister()">Tạo tài khoản</button>
        <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal('registerModal')">Hủy</button>
    </div>
</div>

<div id="createTourModal" class="modal-overlay">
    <div class="modal-box">
        <h2>🎉 Tạo giải mới</h2>
        <div class="input-row" style="flex-direction:column">
            <input type="text" id="c_ten_giai" placeholder="Tên giải đấu">
            <input type="text" id="c_dia_diem" placeholder="Địa điểm">
            <input type="date" id="c_ngay">
            <input type="password" id="c_mat_khau" placeholder="Mật khẩu Admin (Mặc định: 123)" value="123">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="createNewTour()">Tạo giải</button>
        <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal('createTourModal')">Hủy</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://mvefkcaqvjflrgmaybev.supabase.co'.trim().replace(/\/+$/, '');
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q'.trim();
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CURRENT_USER = null;
let CURRENT_TOUR = null;
let IS_TOUR_OWNER = false;
let VDVS = [], MATCHES = [];
let fallbackTimer = null;
let LAST_RENDER_HASH = '';
let IS_EDITING_SCORE = false;

function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    setTimeout(() => t.className = '', 3000);
}
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function isSuperAdmin() { return CURRENT_USER && CURRENT_USER.username.toLowerCase() === 'admin'; }
function canManageTour(tour) { if (!CURRENT_USER) return false; return isSuperAdmin() || (tour.admin_id === CURRENT_USER.id); }

function updateAuthUI() {
    const c = document.getElementById('authBtns');
    if (CURRENT_USER) {
        const badge = isSuperAdmin() ? '<span style="background:var(--accent);color:#000;padding:1px 3px;border-radius:3px;font-size:0.55rem;font-weight:700;margin-left:3px">ADMIN</span>' : '';
        c.innerHTML = `<span class="user-label">👤 ${CURRENT_USER.username}${badge}</span>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Thoát</button>`;
        document.body.classList.add('is-owner');
    } else {
        c.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="showModal('loginModal')">🔑 Đăng nhập</button>`;
        document.body.classList.remove('is-owner');
    }
}

async function doRegister() {
    const user = document.getElementById('regUser').value.trim().toLowerCase();
    const pass = document.getElementById('regPass').value.trim();
    if (!user || !pass) return toast('Nhập đầy đủ thông tin', true);
    if (user.includes(' ')) return toast('Tên không được có khoảng trắng', true);
    if (user === 'admin') return toast('Tên này đã được hệ thống sử dụng', true);
    const { error } = await sb.from('admin_users').insert({ username: user, password: pass });
    if (error) { if (error.code === '23505') return toast('Tên đã tồn tại!', true); return toast('Lỗi: ' + error.message, true); }
    closeModal('registerModal'); toast('✅ Đăng ký thành công!'); showModal('loginModal'); document.getElementById('loginUser').value = user;
}

async function doLogin() {
    const user = document.getElementById('loginUser').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value.trim();
    if (!user || !pass) return toast('Vui lòng nhập tên và mật khẩu', true);
    const { data, error } = await sb.from('admin_users').select('*').eq('username', user).eq('password', pass).single();
    if (error || !data) return toast('Sai tên đăng nhập hoặc mật khẩu!', true);
    CURRENT_USER = data; sessionStorage.setItem('pb_admin', JSON.stringify(data));
    closeModal('loginModal'); updateAuthUI(); toast('✅ Chào, ' + CURRENT_USER.username); loadTourList();
}

function doLogout() { CURRENT_USER = null; sessionStorage.removeItem('pb_admin'); updateAuthUI(); backToList(); toast('Đã đăng xuất'); }

async function deleteTour(ma_giai, tourName) {
    if (!CURRENT_USER) return toast('Vui lòng đăng nhập', true);
    const { data: tour } = await sb.from('robin_canhan_tour').select('*').eq('ma_giai', ma_giai).single();
    if (!tour || !canManageTour(tour)) return toast('Không có quyền xóa', true);
    if (!confirm(`⚠️ XÓA VĨNH VIỄN giải "${tourName}"?`)) return;
    toast('🗑️ Đang xóa...');
    sb.removeAllChannels(); stopFallbackPolling();
    await sb.from('robin_canhan_tran_dau').delete().eq('ma_giai', ma_giai);
    await sb.from('robin_canhan_vdv').delete().eq('ma_giai', ma_giai);
    const { error } = await sb.from('robin_canhan_tour').delete().eq('ma_giai', ma_giai);
    if (error) return toast('Lỗi: ' + error.message, true);
    toast('✅ Đã xóa'); if (CURRENT_TOUR && CURRENT_TOUR.ma_giai === ma_giai) { CURRENT_TOUR = null; IS_TOUR_OWNER = false; }
    loadTourList();
}
async function deleteCurrentTour() { if (CURRENT_TOUR) await deleteTour(CURRENT_TOUR.ma_giai, CURRENT_TOUR.ten_giai); }

async function loadTourList() {
    document.getElementById('tourListScreen').style.display = 'block';
    document.getElementById('tourDetailScreen').style.display = 'none';
    const { data: tours } = await sb.from('robin_canhan_tour').select('*').order('ngay_to_chuc', { ascending: false });
    const c = document.getElementById('tourListContainer');
    if (!tours || tours.length === 0) {
        c.innerHTML = '<div class="err-box"><h3>Chưa có giải đấu nào</h3><p>Hãy tạo giải đầu tiên!</p></div>'; return;
    }
    let filtered = tours;
    if (CURRENT_USER && !isSuperAdmin()) filtered = tours.filter(t => t.admin_id === CURRENT_USER.id);
    c.innerHTML = filtered.map(t => {
        const isOwner = canManageTour(t);
        const deleteBtn = isOwner ? `<button class="btn btn-danger btn-sm" style="position:absolute;top:10px;right:10px;z-index:2" onclick="event.stopPropagation();deleteTour('${t.ma_giai}','${t.ten_giai.replace(/'/g,"\\'")}')">🗑️</button>` : '';
        return `<div class="match-card" style="animation-delay:0s;cursor:pointer;padding:14px" onclick="openTour('${t.ma_giai}')">
            ${deleteBtn}
            <div style="font-family:'Oswald';font-size:1rem;font-weight:600;color:var(--accent);margin-bottom:4px;padding-right:36px">${t.ten_giai}</div>
            <div style="font-size:0.75rem;color:var(--text-dim)">📍 ${t.dia_diem || 'Chưa cập nhật'} · 📅 ${new Date(t.ngay_to_chuc).toLocaleDateString('vi-VN')}</div>
        </div>`;
    }).join('');
}

async function createNewTour() {
    const ten = document.getElementById('c_ten_giai').value.trim();
    const dd = document.getElementById('c_dia_diem').value.trim();
    const ngay = document.getElementById('c_ngay').value;
    const mk = document.getElementById('c_mat_khau').value.trim() || '123';
    if (!ten || !ngay) return toast('Nhập tên giải và ngày', true);
    const { data: last } = await sb.from('robin_canhan_tour').select('ma_giai').order('ma_giai', { ascending: false }).limit(1);
    let n = 1;
    if (last && last.length && last[0].ma_giai.startsWith('C')) { const cur = parseInt(last[0].ma_giai.substring(1), 10); if (!isNaN(cur)) n = cur + 1; }
    const mg = 'C' + String(n).padStart(3, '0');
    const { error } = await sb.from('robin_canhan_tour').insert({ ma_giai: mg, ten_giai: ten, dia_diem: dd, ngay_to_chuc: ngay, mat_khau_admin: mk, admin_id: CURRENT_USER.id });
    if (error) return toast('Lỗi: ' + error.message, true);
    closeModal('createTourModal'); toast('✅ Đã tạo giải!'); loadTourList();
}

async function openTour(mg) {
    const { data: tour } = await sb.from('robin_canhan_tour').select('*').eq('ma_giai', mg).single();
    if (!tour) return toast('Không tìm thấy giải', true);
    CURRENT_TOUR = tour; IS_TOUR_OWNER = canManageTour(tour);
    document.getElementById('tourListScreen').style.display = 'none';
    document.getElementById('tourDetailScreen').style.display = 'block';
    document.getElementById('headerTitle').textContent = tour.ten_giai;
    document.getElementById('headerSub').textContent = `📍 ${tour.dia_diem || ''} · 📅 ${new Date(tour.ngay_to_chuc).toLocaleDateString('vi-VN')}`;
    LAST_RENDER_HASH = '';
    await loadData();
    sb.removeAllChannels();
    sb.channel('tour_vdv_' + mg).on('postgres_changes', { event: '*', schema: 'public', table: 'robin_canhan_vdv', filter: `ma_giai=eq.${mg}` }, loadData).subscribe();
    sb.channel('tour_match_' + mg).on('postgres_changes', { event: '*', schema: 'public', table: 'robin_canhan_tran_dau', filter: `ma_giai=eq.${mg}` }, loadData).subscribe();
    startFallbackPolling(mg);
}

function backToList() {
    CURRENT_TOUR = null; IS_TOUR_OWNER = false;
    sb.removeAllChannels(); stopFallbackPolling();
    document.getElementById('headerTitle').textContent = 'Giải Đấu Pickleball';
    document.getElementById('headerSub').textContent = 'Bảng xếp hạng & Lịch thi đấu';
    loadTourList();
}

function createDataHash() {
    const vdvStr = VDVS.map(v => v.id + '|' + v.ten_vdv).join(',');
    const matchStr = MATCHES.map(m => `${m.id}|${m.vong}|${m.doi_a_1}|${m.doi_a_2}|${m.doi_b_1}|${m.doi_b_2}|${m.diem_a}|${m.diem_b}|${m.trang_thai}`).join(',');
    return vdvStr + '###' + matchStr + '###' + IS_TOUR_OWNER;
}

async function loadData() {
    if (!CURRENT_TOUR) return;
    if (IS_EDITING_SCORE) return;
    const mg = CURRENT_TOUR.ma_giai;
    const { data: v } = await sb.from('robin_canhan_vdv').select('*').eq('ma_giai', mg).order('created_at');
    VDVS = v || [];
    const { data: m } = await sb.from('robin_canhan_tran_dau').select('*').eq('ma_giai', mg).order('vong').order('created_at');
    MATCHES = m || [];
    const newHash = createDataHash();
    if (newHash === LAST_RENDER_HASH) return;
    LAST_RENDER_HASH = newHash;
    renderVdvs(); renderMatches(); renderRanking();
}

// ============================================================
// 🌟 THUẬT TOÁN GHÉP CẶP 2v2 VỚI BACKTRACKING
// ============================================================
// Quy tắc:
//   1. Mỗi lượt chia VĐV thành các đội 2 người
//   2. Mỗi VĐV ghép với tất cả VĐV còn lại đúng 1 lần (không lặp đồng đội)
//   3. Ghép 2 đội thành 1 trận đấu 2v2
//   4. Nếu cách ghép hiện tại làm lượt sau không thể ghép đủ → backtrack, thử cách khác
//   5. Xoay vòng đến khi mỗi VĐV đã ghép với tất cả VĐV còn lại
//
// Ví dụ 4 VĐV A,B,C,D:
//   Lượt 1: (A+B) vs (C+D)
//   Lượt 2: (A+C) vs (B+D)
//   Lượt 3: (A+D) vs (B+C)
// ============================================================

function generate2v2Schedule() {
    const players = VDVS.map(v => v.id);
    const n = players.length;
    if (n < 4) return [];

    // Tạo tập tất cả cặp đồng đội có thể: n*(n-1)/2 cặp
    const allPossiblePairs = [];
    for (let i = 0; i < n; i++)
        for (let j = i + 1; j < n; j++)
            allPossiblePairs.push([players[i], players[j]]);

    const totalPairsNeeded = allPossiblePairs.length;
    const pairsPerRound = Math.floor(n / 2);  // Số đội mỗi vòng
    const maxRounds = n - 1;                   // Số vòng tối đa

    const usedPairs = new Set();
    const allMatches = [];
    let solveAttempts = 0;

    function pk(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // Tìm 1 perfect matching: chọn `need` cặp không giao nhau từ `avail`
    function findMatching(avail, need, idx, chosen, usedPlayers) {
        if (chosen.length === need) return true;
        // Tối ưu: nếu không còn đủ cặp → cắt nhánh
        if (avail.length - idx < need - chosen.length) return false;

        for (let i = idx; i < avail.length; i++) {
            const [a, b] = avail[i];
            if (usedPlayers.has(a) || usedPlayers.has(b)) continue;

            chosen.push(avail[i]);
            usedPlayers.add(a);
            usedPlayers.add(b);

            if (findMatching(avail, need, i + 1, chosen, usedPlayers)) return true;

            chosen.pop();
            usedPlayers.delete(a);
            usedPlayers.delete(b);
        }
        return false;
    }

    // Backtracking chính: thử ghép từng vòng
    function solve(roundIdx) {
        solveAttempts++;
        if (solveAttempts > 50000) return false; // Giới hạn an toàn

        // ✅ Hoàn thành: tất cả cặp đồng đội đã được dùng
        if (usedPairs.size >= totalPairsNeeded) return true;
        if (roundIdx >= maxRounds) return usedPairs.size >= totalPairsNeeded;

        // Lấy các cặp chưa dùng, shuffle để thử ngẫu nhiên
        const available = shuffle(allPossiblePairs.filter(([a, b]) => !usedPairs.has(pk(a, b))));
        const need = pairsPerRound;

        // Thử nhiều cách ghép khác nhau cho vòng này
        for (let attempt = 0; attempt < 100; attempt++) {
            const shuffled = shuffle(available);
            const chosen = [];
            const usedPlayers = new Set();

            if (findMatching(shuffled, need, 0, chosen, usedPlayers)) {
                // Đánh dấu các cặp đồng đội đã dùng
                const keys = chosen.map(([a, b]) => pk(a, b));
                keys.forEach(k => usedPairs.add(k));

                // Ghép 2 đội liên tiếp thành 1 trận 2v2
                const roundMatches = [];
                for (let i = 0; i + 1 < chosen.length; i += 2) {
                    roundMatches.push({
                        vong: roundIdx + 1,
                        doi_a_1: chosen[i][0],
                        doi_a_2: chosen[i][1],
                        doi_b_1: chosen[i + 1][0],
                        doi_b_2: chosen[i + 1][1],
                        trang_thai: 'chua_dau'
                    });
                }
                allMatches.push(...roundMatches);

                // Đệ quy sang vòng tiếp theo
                if (solve(roundIdx + 1)) return true;

                // ❌ Lượt sau không thể ghép đủ → BACKTRACK, thử cách khác
                for (let i = 0; i < roundMatches.length; i++) allMatches.pop();
                keys.forEach(k => usedPairs.delete(k));
            }
        }

        return false;
    }

    // Chạy backtracking
    const success = solve(0);

    if (success && allMatches.length > 0) {
        showDebugInfo(true, totalPairsNeeded, allMatches.length, solveAttempts);
        return allMatches;
    }

    // Fallback: Circle Method (luôn đúng cho N chẵn)
    showDebugInfo(false, totalPairsNeeded, 0, solveAttempts);
    return circleMethodFallback(players);
}

// Fallback: Circle Method (dùng khi backtracking quá chậm)
function circleMethodFallback(players) {
    let list = [...players];
    while (list.length % 2 !== 0) list.push('__BYE__');
    const N = list.length;
    const matches = [];
    const fixed = list[0];
    let rotating = list.slice(1);

    for (let round = 0; round < N - 1; round++) {
        const current = [fixed, ...rotating];
        const pairs = [];
        for (let i = 0; i < N / 2; i++) {
            pairs.push([current[i], current[N - 1 - i]]);
        }
        const realPairs = pairs.filter(([a, b]) => a !== '__BYE__' && b !== '__BYE__');
        for (let i = 0; i + 1 < realPairs.length; i += 2) {
            matches.push({
                vong: round + 1,
                doi_a_1: realPairs[i][0], doi_a_2: realPairs[i][1],
                doi_b_1: realPairs[i + 1][0], doi_b_2: realPairs[i + 1][1],
                trang_thai: 'chua_dau'
            });
        }
        rotating = [rotating[rotating.length - 1], ...rotating.slice(0, rotating.length - 1)];
    }
    return matches;
}

function showDebugInfo(backtrackSuccess, totalPairs, totalMatches, attempts) {
    const el = document.getElementById('scheduleDebug');
    if (!el) return;
    el.style.display = 'block';
    const method = backtrackSuccess ? '✅ Backtracking' : '⚠️ Circle Method (fallback)';
    el.innerHTML = `<b>Phương pháp:</b> ${method}<br>` +
        `<b>Tổng cặp đồng đội:</b> ${totalPairs} | <b>Tổng trận:</b> ${totalMatches} | <b>Số lần thử:</b> ${attempts.toLocaleString()}`;
}

async function generateSchedule() {
    if (!IS_TOUR_OWNER) return toast('Không có quyền', true);
    if (VDVS.length < 4) return toast('Cần ít nhất 4 VĐV để đánh đôi 2v2', true);
    if (!confirm('Tạo lịch mới sẽ XÓA toàn bộ lịch và điểm số cũ. Tiếp tục?')) return;
    toast('⏳ Đang tính toán ghép cặp...');

    // Xóa lịch cũ
    await sb.from('robin_canhan_tran_dau').delete().eq('ma_giai', CURRENT_TOUR.ma_giai);

    // Tạo lịch mới bằng backtracking
    const t0 = performance.now();
    const matches = generate2v2Schedule().map(m => ({ ...m, ma_giai: CURRENT_TOUR.ma_giai }));
    const elapsed = Math.round(performance.now() - t0);

    if (matches.length === 0) return toast('Không thể tạo lịch', true);

    const { error } = await sb.from('robin_canhan_tran_dau').insert(matches);
    if (error) return toast('Lỗi: ' + error.message, true);

    // Validation: kiểm tra không có cặp đồng đội lặp
    const pairCheck = new Set();
    let duplicates = 0;
    matches.forEach(m => {
        const k1 = m.doi_a_1 < m.doi_a_2 ? m.doi_a_1 + '|' + m.doi_a_2 : m.doi_a_2 + '|' + m.doi_a_1;
        const k2 = m.doi_b_1 < m.doi_b_2 ? m.doi_b_1 + '|' + m.doi_b_2 : m.doi_b_2 + '|' + m.doi_b_1;
        if (pairCheck.has(k1)) duplicates++;
        if (pairCheck.has(k2)) duplicates++;
        pairCheck.add(k1);
        pairCheck.add(k2);
    });

    const debugEl = document.getElementById('scheduleDebug');
    if (debugEl) {
        const existing = debugEl.innerHTML;
        debugEl.innerHTML = existing + `<br><b>Thời gian:</b> ${elapsed}ms | <b>Cặp trùng:</b> ${duplicates === 0 ? '✅ Không có' : '⚠️ ' + duplicates}`;
    }

    toast(`✅ Đã tạo ${matches.length} trận (${elapsed}ms)`);
    await loadData();
}

    if (!IS_TOUR_OWNER) return toast('Không có quyền', true);
    if (!confirm('Xóa toàn bộ lịch và điểm?')) return;
    await sb.from('robin_canhan_tran_dau').delete().eq('ma_giai', CURRENT_TOUR.ma_giai);
    document.getElementById('scheduleDebug').style.display = 'none';
    toast('Đã xóa'); await loadData();
}

function getVdvName(id) { const v = VDVS.find(x => x.id === id); return v ? v.ten_vdv : '???'; }

function renderMatches() {
    document.getElementById('mc-count').textContent = `${MATCHES.length} trận`;
    const c = document.getElementById('match-area');
    if (!MATCHES.length) {
        c.innerHTML = '<div class="err-box"><h3>Chưa có lịch</h3><p>Admin hãy bấm "⚡ Tạo lịch 2v2"</p></div>'; return;
    }
    const byR = {};
    MATCHES.forEach(m => { if (!byR[m.vong]) byR[m.vong] = []; byR[m.vong].push(m); });

    let h = '<div class="match-grid">';
    Object.keys(byR).sort((a, b) => a - b).forEach(round => {
        byR[round].forEach((m, idx) => {
            const done = m.trang_thai === 'da_dau';
            const stCls = done ? 'done' : 'wait';
            const stTxt = done ? 'Hoàn thành' : 'Chờ đấu';
            const delay = Math.min(idx * 0.03, 1.2);

            h += `<div class="match-card" style="animation-delay:${delay}s">`;
            h += `<div class="mc-head"><span class="mc-round">Vòng ${m.vong}</span><span class="mc-status ${stCls}">${stTxt}</span></div>`;
            h += `<div class="mc-body"><div class="mc-teams">`;
            h += `<div class="mc-team"><span class="mc-team-label">Đội 1</span><div class="mc-team-names">${getVdvName(m.doi_a_1)}<span class="amp">&</span>${getVdvName(m.doi_a_2)}</div></div>`;
            h += `<div class="mc-vs"><div class="vs-circle">VS</div>`;
            if (IS_TOUR_OWNER) {
                h += `<div class="mc-score-row">
                    <input type="number" class="score-input" id="sa-${m.id}" value="${m.diem_a ?? ''}" placeholder="-"
                        onfocus="IS_EDITING_SCORE=true" onblur="IS_EDITING_SCORE=false">
                    <span class="mc-score sep">-</span>
                    <input type="number" class="score-input" id="sb-${m.id}" value="${m.diem_b ?? ''}" placeholder="-"
                        onfocus="IS_EDITING_SCORE=true" onblur="IS_EDITING_SCORE=false">
                </div>
                <div class="mc-actions">
                    <button class="btn btn-success btn-sm" onclick="saveScore('${m.id}')">💾 Lưu</button>
                    ${done ? `<button class="btn btn-danger btn-sm" onclick="resetScore('${m.id}')">↺</button>` : ''}
                </div>`;
            } else {
                if (done) {
                    h += `<div class="mc-score-row"><span class="mc-score s1">${m.diem_a}</span><span class="mc-score sep">-</span><span class="mc-score s2">${m.diem_b}</span></div>`;
                } else {
                    h += `<span class="mc-noscore">Chưa đấu</span>`;
                }
            }
            h += `</div>`;
            h += `<div class="mc-team"><span class="mc-team-label">Đội 2</span><div class="mc-team-names">${getVdvName(m.doi_b_1)}<span class="amp">&</span>${getVdvName(m.doi_b_2)}</div></div>`;
            h += `</div></div></div>`;
        });
    });
    h += '</div>';
    c.innerHTML = h;
}

async function saveScore(id) {
    if (!IS_TOUR_OWNER) return toast('Không có quyền', true);
    const a = parseInt(document.getElementById('sa-' + id).value);
    const b = parseInt(document.getElementById('sb-' + id).value);
    if (isNaN(a) || isNaN(b)) return toast('Nhập đủ 2 tỷ số', true);
    if (a === b) return toast('Không có hòa!', true);
    if (a < 0 || b < 0) return toast('Tỷ số không âm', true);
    IS_EDITING_SCORE = false;
    const { error } = await sb.from('robin_canhan_tran_dau').update({ diem_a: a, diem_b: b, trang_thai: 'da_dau' }).eq('id', id);
    if (error) return toast('Lỗi: ' + error.message, true);
    toast('✅ Đã lưu'); await loadData();
}

async function resetScore(id) {
    if (!IS_TOUR_OWNER) return toast('Không có quyền', true);
    if (!confirm('Reset trận này?')) return;
    await sb.from('robin_canhan_tran_dau').update({ diem_a: null, diem_b: null, trang_thai: 'chua_dau' }).eq('id', id);
    toast('Đã reset'); await loadData();
}

function renderRanking() {
    const el = document.getElementById('rank-area');
    if (!VDVS.length) {
        el.innerHTML = '<div class="err-box"><h3>Chưa có dữ liệu</h3><p>Admin hãy thêm VĐV.</p></div>'; return;
    }

    const stats = {};
    VDVS.forEach(v => {
        const totalMatches = MATCHES.filter(m =>
            m.doi_a_1 === v.id || m.doi_a_2 === v.id ||
            m.doi_b_1 === v.id || m.doi_b_2 === v.id
        ).length;
        stats[v.id] = { id: v.id, ten: v.ten_vdv, tran_da_dau: 0, tran_tong: totalMatches, thang: 0, thua: 0, diem: 0, dt: 0, db: 0, hs: 0 };
    });

    MATCHES.filter(m => m.trang_thai === 'da_dau').forEach(m => {
        const a1 = stats[m.doi_a_1], a2 = stats[m.doi_a_2];
        const b1 = stats[m.doi_b_1], b2 = stats[m.doi_b_2];
        if (!a1 || !a2 || !b1 || !b2) return;
        const diff = m.diem_a - m.diem_b;
        [a1, a2, b1, b2].forEach(p => { p.tran_da_dau++; });
        if (m.diem_a > m.diem_b) {
            [a1, a2].forEach(p => { p.thang++; p.diem++; p.dt += m.diem_a; p.db += m.diem_b; p.hs += diff; });
            [b1, b2].forEach(p => { p.thua++; p.dt += m.diem_b; p.db += m.diem_a; p.hs -= diff; });
        } else {
            [b1, b2].forEach(p => { p.thang++; p.diem++; p.dt += m.diem_b; p.db += m.diem_a; p.hs += Math.abs(diff); });
            [a1, a2].forEach(p => { p.thua++; p.dt += m.diem_a; p.db += m.diem_b; p.hs -= Math.abs(diff); });
        }
    });

    const sorted = Object.values(stats).sort((x, y) => {
        if (y.diem !== x.diem) return y.diem - x.diem;
        if (y.hs !== x.hs) return y.hs - x.hs;
        return x.ten.localeCompare(y.ten);
    });

    let h = '<div class="rank-wrap"><table class="rank-table"><thead><tr><th>#</th><th>Vận Động Viên</th><th>Trận</th><th>Thắng</th><th>Thua</th><th>Điểm</th><th>HS</th></tr></thead><tbody>';
    sorted.forEach((s, i) => {
        const r = i + 1;
        const rc = r === 1 ? 'r1' : r === 2 ? 'r2' : r === 3 ? 'r3' : 'r0';
        const hsCls = s.hs > 0 ? 'plus' : s.hs < 0 ? 'minus' : '';
        const hsStr = s.hs > 0 ? '+' + s.hs : s.hs;
        const matchCount = `<span class="match-count"><span class="played">${s.tran_da_dau}</span>/${s.tran_tong}</span>`;
        h += `<tr><td><span class="rank-num ${rc}">${r}</span></td><td title="${s.ten}">${s.ten}</td><td>${matchCount}</td><td style="color:var(--green);font-weight:700">${s.thang}</td><td style="color:var(--red);font-weight:700">${s.thua}</td><td style="font-weight:800;font-size:0.95rem;color:var(--accent)">${s.diem}</td><td class="${hsCls}">${hsStr}</td></tr>`;
    });
    h += '</tbody></table></div>';
    el.innerHTML = h;
}

function startFallbackPolling(mg) {
    stopFallbackPolling();
    fallbackTimer = setInterval(async () => {
        if (CURRENT_TOUR && CURRENT_TOUR.ma_giai === mg && !document.hidden) await loadData();
    }, 15000);
}
function stopFallbackPolling() { if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && CURRENT_TOUR) loadData(); });

(async () => {
    const u = sessionStorage.getItem('pb_admin');
    if (u) CURRENT_USER = JSON.parse(u);
    updateAuthUI();
    document.getElementById('c_ngay').valueAsDate = new Date();
    loadTourList();
})();
</script>
